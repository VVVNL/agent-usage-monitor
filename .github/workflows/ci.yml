name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: fmt, clippy, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows-build:
    name: Windows release build
    runs-on: windows-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p aum-app --locked
      - name: Installer script compiles
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          python scripts/third_party.py
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.0.0-ci" "/DSourceExe=..\target\release\agent-usage-monitor.exe" installer\agent-usage-monitor.iss
      - uses: actions/upload-artifact@v4
        with:
          name: agent-usage-monitor-windows-x64
          path: |
            target/release/agent-usage-monitor.exe
            dist/*-setup.exe

  macos-build:
    name: macOS universal app bundle
    runs-on: macos-14
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the app bundle and DMG (ad-hoc signed)
        run: scripts/macos-bundle.sh 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: agent-usage-monitor-macos-universal
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
