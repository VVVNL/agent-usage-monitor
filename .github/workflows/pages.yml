name: Website

# Publishes the static site in `site/` to GitHub Pages (free hosting). One-time setup in the
# repository: Settings > Pages > Build and deployment > Source: "GitHub Actions". The site is
# then at https://<owner>.github.io/<repo>/. Pages on a private repository needs a paid GitHub plan;
# on the free plan the repository must be public.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, as in GitHub's own Pages starter workflow: deploying in the same job right after the
  # upload intermittently fails with 'No artifacts named "github-pages" were found'
  # (actions/deploy-pages issue 451).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
