[package]
name = "aum-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Deliberately does not inherit the workspace lints: this is the only crate
# allowed to contain `unsafe` (Win32 calls), and it is kept tiny.
[lints.rust]
unsafe_code = "deny"

[dependencies]
aum-store.workspace = true

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
