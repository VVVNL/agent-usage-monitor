name: Release

# Builds every supported platform and publishes one GitHub release:
#   Windows  tray app: installer + portable zip (also contains the `aum` command-line tool); the
#            checksum list is signed (SHA256SUMS.txt.sig) so installed copies can update themselves
#   macOS    tray app: universal (Apple Silicon + Intel) DMG   [skipped if SKIP_MACOS=true]
#   Linux    `aum` command-line tool only (there is no Linux tray app yet)
#
# Push a tag `vX.Y.Z` that matches the version in Cargo.toml. To try the builds without
# publishing, run this workflow by hand (Actions > Release > Run workflow): it uploads the files
# as workflow artifacts and creates no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (app, installer, portable zip)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Resolve version (tag must match the crate version)
        id: ver
        shell: bash
        run: |
          ver="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$tag" = "$ver" ] || { echo "Tag $tag does not match Cargo.toml version $ver"; exit 1; }
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - run: cargo test --workspace --locked
      - run: cargo build --release -p aum-app -p aum-cli --locked

      - name: Regenerate the third-party licence list
        run: python scripts/third_party.py

      - name: Package (unsigned)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          # Portable zip
          $stage = "dist/agent-usage-monitor-$v-windows-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/agent-usage-monitor.exe, target/release/aum.exe, LICENSE, README.md, docs/THIRD_PARTY.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/agent-usage-monitor-$v-windows-x64-portable.zip"
          Remove-Item -Recurse -Force $stage
          # Installer
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSourceExe=..\target\release\agent-usage-monitor.exe" installer\agent-usage-monitor.iss
          # Checksums
          Push-Location dist
          Get-ChildItem -File | Where-Object Name -ne "SHA256SUMS.txt" | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@v6
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  # Runs by default. If macOS runners are unavailable on your plan, a job waiting for a runner
  # that never arrives cannot be cancelled normally: set the repository variable SKIP_MACOS=true
  # (Settings > Secrets and variables > Actions > Variables) to leave the DMG out.
  macos:
    name: macOS (universal DMG)
    if: ${{ vars.SKIP_MACOS != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the version (tag must match the crate version)
        run: |
          ver="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$tag" = "$ver" ] || { echo "Tag $tag does not match Cargo.toml version $ver"; exit 1; }
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - run: cargo test --workspace --locked
      - run: python3 scripts/third_party.py

      - name: Build, sign and (if credentials exist) notarize
        env:
          # Optional. Without them the app is ad-hoc signed and needs right-click > Open once.
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: scripts/macos-bundle.sh "$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: dist-macos
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error

  linux-cli:
    name: Linux (aum command-line tool)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the version (tag must match the crate version)
        run: |
          ver="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$tag" = "$ver" ] || { echo "Tag $tag does not match Cargo.toml version $ver"; exit 1; }
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - run: cargo test --workspace --locked
      - run: cargo build --release -p aum-cli --locked

      - name: Package
        run: |
          stage="aum-$VERSION-linux-x64"
          mkdir -p "dist/$stage"
          cp target/release/aum LICENSE README.md "dist/$stage/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          rm -rf "dist/$stage"
          (cd dist && sha256sum "$stage.tar.gz" > SHA256SUMS-linux.txt)

      - uses: actions/upload-artifact@v6
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    # Only for tags. Needs Windows and Linux; macOS too unless it was skipped on purpose (SKIP_MACOS),
    # but if it ran and failed, nothing is published.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.windows.result == 'success' && needs.linux-cli.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    needs: [windows, macos, linux-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Sign the checksum list so installed copies can verify an update before running it. The secret
      # holds an Ed25519 private key in PEM form (see docs/RELEASE_CHECKLIST.md, "Update signing key");
      # the matching public key is compiled into the app (crates/update, PUBLIC_KEY_B64). Without the
      # secret the release is still published, but installed copies only announce it.
      - name: Sign SHA256SUMS.txt (update signature)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning title=Updates not signed::The UPDATE_SIGNING_KEY secret is not set, so this release has no SHA256SUMS.txt.sig and installed copies will only announce it, not install it."
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/update-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/SHA256SUMS.txt -out "$RUNNER_TEMP/sums.sig"
          base64 -w0 "$RUNNER_TEMP/sums.sig" > dist/SHA256SUMS.txt.sig
          # Check our own signature before publishing it.
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/pub.pem"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/pub.pem" -in dist/SHA256SUMS.txt -sigfile "$RUNNER_TEMP/sums.sig"
          rm -f "$key" "$RUNNER_TEMP/sums.sig"
      - run: ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
